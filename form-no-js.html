<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Without JavaScript</title>
    <link rel="stylesheet" href="assets/styles/global.css">
</head>
<body>
    <header>
        <a href="/" rel="home">Home</a>
        <nav>
            <ul>
                <li><a href="about.html">About</a></li>

                <li><a href="form-no-js.html">No-JS Form</a></li>
            </ul>
        </nav>
    </header>
    <h1>Form With No JavaScript</h1>
    <form action="https://httpbin.org/post" method="post">
        <label for="name">Name:
            <input type="text" name="name" id="name" autocomplete="name" placeholder="John Doe">
        </label>
        <label for="email">Email:
            <input type="email" name="email" id="email" autocomplete="email" placeholder="thomas@example.com">
        </label>
        <label for="comments">Comments:
            <textarea name="comments" id="comments" placeholder="I'd like to hire you."></textarea>
        </label>
        <label for="possible_bot">
            <input type="hidden" name="possible_bot" id="possible_bot" value="true">
        </label>
        <button type="submit">Submit</button>
    </form>
</body>
</html>
